[package]
name = "rbxts_luau_check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]

# Luau's compiler, built from source with the C++ toolchain (MSVC through vswhere, or a system C++ compiler).
# Pinned exactly: Luau 0.740 (luau0-src 0.22.0+luau740), the newest release when this was added (2026-10). The load
# check answers "does Luau refuse this file" with this compiler, so a version change can move a file across the
# limits (constant folding grows between releases): bump it on purpose, and re-run the limit probes when you do.
[build-dependencies]
luau0-src = "=0.22.0"
# The exception shim (src/shim.cpp); the version luau0-src already locks.
cc = "1.2"
