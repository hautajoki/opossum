[package]
name = "luau"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

# Luau's compiler for the O2 gate, built from source. Pinned exactly (Luau 0.740): a version change can move a file
# across Luau's limits, so bump it on purpose. The workspace patches in vendor/luau0-src (its VENDOR.md says why).
[build-dependencies]
luau0-src = "=0.22.0"
cc = "1.2"
