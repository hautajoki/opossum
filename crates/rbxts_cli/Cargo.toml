[package]
name = "rbxts_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "An rbxtsc-compatible command line over rbxts_transform: `Cli::new().plugin(p).run()` for a user's own binary with compiled-in plugins (DESIGN §11.6), and the plain `rbxtsc` binary."

[dependencies]
rbxts_transform.workspace = true
rbxts_plugin.workspace = true
rbxts_project.workspace = true
tsrs_core.workspace = true
tsrs_ast.workspace = true
tsrs_compiler.workspace = true
tsrs_diagnostics.workspace = true
mimalloc-safe.workspace = true
notify.workspace = true
memory-stats.workspace = true
chrono.workspace = true
serde_json.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
serde_json.workspace = true
rbxts_test_plugins.workspace = true
rbxts_test_support.workspace = true

[[bin]]
name = "rbxtsc"
path = "src/main.rs"
