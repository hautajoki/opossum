[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

# tsrs main, vendored (vendor/tsrs/VENDOR.md). Cargo.lock started as tsrs's lock file so transitive versions match
# what tsrs tests with.
[workspace.dependencies]
tsrs_core = { path = "vendor/tsrs/crates/tsrs_core" }
tsrs_ast = { path = "vendor/tsrs/crates/tsrs_ast" }
tsrs_vfs = { path = "vendor/tsrs/crates/tsrs_vfs" }
tsrs_tsoptions = { path = "vendor/tsrs/crates/tsrs_tsoptions" }
tsrs_compiler = { path = "vendor/tsrs/crates/tsrs_compiler" }
tsrs_diagnostics = { path = "vendor/tsrs/crates/tsrs_diagnostics" }
tsrs_checker = { path = "vendor/tsrs/crates/tsrs_checker" }
tsrs_scanner = { path = "vendor/tsrs/crates/tsrs_scanner" }
tsrs_parser = { path = "vendor/tsrs/crates/tsrs_parser" }
tsrs_printer = { path = "vendor/tsrs/crates/tsrs_printer" }
tsrs_sourcemap = { path = "vendor/tsrs/crates/tsrs_sourcemap" }
tsrs_module = { path = "vendor/tsrs/crates/tsrs_module" }
tsrs_contentmapper = { path = "vendor/tsrs/crates/tsrs_contentmapper" }
mimalloc-safe = { version = "0.1.67", features = ["v3", "no_thp"] }
rustc-hash = "2"
luau = { path = "crates/luau" }
lower = { path = "crates/lower" }
route = { path = "crates/route" }
place = { path = "crates/place" }
sync = { path = "crates/sync" }
cloud = { path = "crates/cloud" }
media = { path = "crates/media" }
spec = { path = "crates/spec" }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = { version = "1.1.8", features = ["preserve_order"] }
globset = "0.4"
blake3 = "1.8"
libc = "0.2"

# luau0-src with the include directories, defines and build stamp crates/luau needs (vendor/luau0-src/VENDOR.md).
[patch.crates-io]
luau0-src = { path = "vendor/luau0-src" }

# A debug checker is unusably slow, so even dev builds are optimised (as in tsrs).
[profile.dev]
opt-level = 3
lto = "off"
codegen-units = 256
incremental = true

# Luau (the luau crate's gate, built by luau0-src) without its asserts in every profile: luau0-src turns them on under
# debug_assertions, and a failed one ends in __debugbreak (a crash) instead of an error. A build dependency, so this
# package override (it wins over build-override) is what reaches it.
[profile.dev.package.luau0-src]
debug-assertions = false

# Measurements (`--profile measure`): release optimisation without LTO, like tsrs's `ci` profile.
[profile.measure]
inherits = "release"
lto = "off"
codegen-units = 16

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
